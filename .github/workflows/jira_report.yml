name: Generate Jira Sprint Worklog Report

on:
  schedule:
    # Runs every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch: # Allows manual trigger via GitHub UI button

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas openpyxl

      - name: Execute Report Script
        env:
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python export_sprint_worklogs.py

      - name: Upload Excel as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sprint-Worklog-Report
          path: sprint_worklog_report.xlsx
