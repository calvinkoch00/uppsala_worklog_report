name: Generate Jira Sprint Worklog Report

on:
  schedule:
    - cron: '0 7 * * 1' # Every Monday at 07:00 UTC
  workflow_dispatch:      # Allows button trigger from UI / API

permissions:
  contents: write # Needed to commit back to the repo

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Report Script
        env:
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python export_sprint_worklogs.py

      - name: Commit and Push Updated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add csv/ sprint_worklog_report.xlsx
          if git diff --staged --quiet; then
            echo "No changes in worklogs to commit."
          else
            git commit -m "chore: automated worklog report update [skip ci]"
            git push origin main
          fi